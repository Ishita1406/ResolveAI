services:
  redis:
    image: redis:8.6.7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    network_mode: host
    env_file: .env
    environment:
      # Paths inside the container (the build context is backend/ only).
      POLICY_DOCS_DIR: /app/policies
      EMBEDDING_CACHE_DIR: /home/app/.cache/resolveai/fastembed
      EVAL_RESULTS_DIR: /app/eval-results
    volumes:
      - ./docs/policies:/app/policies:ro
      - ./evals/results:/app/eval-results:ro
      - embedding-models:/home/app/.cache/resolveai
    depends_on:
      redis:
        condition: service_healthy

  # The web app (call screen, conversation replay, eval dashboard) on 127.0.0.1:8080.
  # nginx forwards the API routes to the backend, which shares the host network.
  frontend:
    build: ./frontend
    network_mode: host
    environment:
      BACKEND_URL: http://127.0.0.1:8000
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
    depends_on:
      - backend

volumes:
  embedding-models:
