services:
  redis:
    image: redis:8.6.7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    network_mode: host
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
