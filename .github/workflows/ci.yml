name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Throwaway CI-only database; trust auth means no credential to store.
      postgres:
        image: pgvector/pgvector:0.8.0-pg14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.6.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: resolveai
      TEST_POSTGRES_DB: resolveai_test
      REDIS_URL: redis://127.0.0.1:6379/0
      EMBEDDING_CACHE_DIR: /home/runner/.cache/resolveai/fastembed
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv sync --locked
      # The embedding model (~65 MB) for the retrieval quality test; downloaded on a miss.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/resolveai/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Fetch embedding model
        run: uv run python -c "from app.retrieval.embedding import embedder_from_settings as e; e().embed_query('warm up')"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest
