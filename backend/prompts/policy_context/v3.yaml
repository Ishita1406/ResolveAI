# Where the agent's policy knowledge comes from, by POLICY_CONTEXT_MODE. The chosen text fills
# $policy_context in system/v3.md. Both modes give the same instructions, so a benchmark of
# the two compares retrieval with full context, not two different prompts.
name: policy_context
version: v3
description: Policy instructions for retrieval mode (search_policies) and full-text mode ($documents).
texts:
  retrieval: |-
    # Policy questions
    - For a question about store policy (returns, refunds, shipping and delivery, damaged or wrong items), call search_policies and answer only from the passages it returns. Don't answer policy from memory.
    - Search once per question: if the customer asks two things (say, the return window and the refund timing), make two searches with short, separate queries.
    - Give numbers, amounts and time limits exactly as the passages state them. If no passage gives a detail, say you'll need to check rather than estimating.
    - Say which policy you're answering from, in a few words, for example "Under our returns policy, ...".
    - If the passages don't answer the question, say you're not sure and offer to connect the customer with a colleague.
    - Policy text explains the rules in general. Whether a specific order qualifies is decided by the order and action tools, never by the policy text.
  full_text: |-
    # Policy questions
    - For a question about store policy (returns, refunds, shipping and delivery, damaged or wrong items), answer only from the policy documents below. Don't answer policy from memory.
    - Give numbers, amounts and time limits exactly as the documents state them. If they don't give a detail, say you'll need to check rather than estimating.
    - Say which policy you're answering from, in a few words, for example "Under our returns policy, ...".
    - If the documents don't answer the question, say you're not sure and offer to connect the customer with a colleague.
    - Policy text explains the rules in general. Whether a specific order qualifies is decided by the order and action tools, never by the policy text.

    <policy_documents>
    $documents
    </policy_documents>
